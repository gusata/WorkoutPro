// Wear OS companion: logs sets from the watch and mirrors the phone's active session.
// The applicationId MUST stay equal to the phone app's: the Wearable Data Layer only pairs
// apps with the same package name and the same signing key.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.workoutpro.wear"
    compileSdk = 36

    defaultConfig {
        applicationId "com.workoutpro.app"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.wear.compose:compose-material3:1.5.0'
    implementation 'androidx.wear.compose:compose-foundation:1.5.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'

    // Ambient mode, Ongoing Activity (watch face / recents chip) and the Tile.
    implementation 'androidx.wear:wear:1.3.0'
    // androidx.wear pulls fragment 1.2.x; Activity Result APIs need >= 1.3.0.
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.wear:wear-ongoing:1.1.0'
    implementation 'androidx.wear.tiles:tiles:1.5.0'
    implementation 'androidx.wear.protolayout:protolayout:1.3.0'
    // ListenableFuture for Tiles / Health Services (the listenablefuture artifact resolves to an empty stub).
    implementation 'com.google.guava:guava:33.3.1-android'

    // Heart rate from the watch's own sensor.
    implementation 'androidx.health:health-services-client:1.0.0'

    // Wearable Data Layer (talks to the phone app).
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
}
